<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worldtable</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="knobFace" cx="50%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#20395b"/>
        <stop offset="100%" stop-color="#0a1626"/>
      </radialGradient>
    </defs>
  </svg>

  <div id="ambient" aria-hidden="true"></div>

  <div id="stage">
    <header>
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffc93c" stroke-width="1.4">
          <circle cx="12" cy="12" r="9.5"/>
          <path d="M2.5 12h19M12 2.5c3 3 3 16 0 19M12 2.5c-3 3-3 16 0 19" stroke-opacity="0.55"/>
          <path d="M3.5 15.5c2.2-2 3.6 1.8 5.8 0s3.6-4.5 5.8-2.5 3.4 2.6 5.4 1" stroke-width="1.6"/>
        </svg>
        <div>
          <div class="name">WORLD<b>TABLE</b></div>
          <div class="ver">SKY MODEL · v1</div>
        </div>
      </div>

      <div class="sky" id="sky" hidden title="The Sky Model replaying a recorded day. It writes the chords.">
        <span class="lbl">SKY</span>
        <span id="sky-text"></span>
      </div>

      <div class="chord" id="chord" title="The chord that is sounding: the sky's, or the one held on MIDI.">
        <span class="lbl">CHORD</span>
        <span id="chord-text">—</span>
        <span id="chord-roman"></span>
        <span id="chord-state"></span>
      </div>
    </header>

    <!-- Row A: harmony (with the voices view) + layers -->
    <div class="row row-a2">
      <section class="panel">
        <div class="panel-head">
          <span class="panel-title">HARMONY</span>
          <span class="spacer"></span>
          <span class="info">the sky writes · the hold wins</span>
        </div>
        <div class="harmony-body">
          <div class="display chord-body"><canvas id="cv-chord"></canvas></div>
          <div class="harmony-controls">
            <div class="seq-line">
              <div data-select="key" data-caption="KEY"></div>
              <div data-select="mood"></div>
              <div data-select="scale"></div>
              <div data-select="chord_shape" data-caption="SHAPE"></div>
            </div>
            <div class="knob-row">
              <div data-knob="progression" data-label="PROGRESSION"></div>
              <div data-knob="transpose" data-label="TRANSPOSE" data-small="1"></div>
              <div data-knob="register_semis" data-label="REGISTER" data-small="1"></div>
            </div>
            <div class="knob-row">
              <div data-knob="spread" data-label="SPREAD" data-small="1"></div>
              <div data-knob="detune" data-label="DETUNE" data-small="1"></div>
              <div data-knob="drift" data-label="DRIFT" data-small="1"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <span class="panel-title">LAYERS <b>·</b> COLOUR</span>
          <span class="spacer"></span>
          <span class="info">red · green · violet</span>
        </div>
        <div class="layer-body">
          <div class="layer-row">
            <span class="layer-dot red"></span>
            <div data-knob="red_level" data-label="RED" data-small="1"></div>
            <div data-knob="red_decay" data-label="DECAY" data-small="1"></div>
          </div>
          <div class="layer-row">
            <span class="layer-dot green"></span>
            <div data-knob="green_level" data-label="GREEN" data-small="1"></div>
            <div data-knob="green_decay" data-label="DECAY" data-small="1"></div>
          </div>
          <div class="layer-row">
            <span class="layer-dot violet"></span>
            <div data-knob="violet_level" data-label="VIOLET" data-small="1"></div>
            <div data-knob="violet_decay" data-label="DECAY" data-small="1"></div>
          </div>
          <div class="knob-row" style="margin-top:2px">
            <div data-knob="width" data-label="WIDTH" data-small="1"></div>
          </div>
        </div>
      </section>
    </div>

    <!-- Row B: macros + output -->
    <div class="row row-b">
      <section class="panel">
        <div class="panel-head">
          <span class="panel-title">MACROS</span>
          <span class="spacer"></span>
          <span class="info">0.5 is neutral</span>
        </div>
        <div class="knob-row macro-row">
          <div data-knob="macro_storm" data-label="STORM"></div>
          <div data-knob="macro_breath" data-label="BREATH"></div>
          <div data-knob="macro_glow" data-label="GLOW"></div>
          <div data-knob="macro_space" data-label="SPACE"></div>
          <div data-knob="macro_drift" data-label="DRIFT"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <span class="panel-title">OUTPUT</span>
          <span class="spacer"></span>
          <span class="info" id="gain-info"></span>
        </div>
        <div class="out-body">
          <div class="display"><canvas id="cv-meter"></canvas></div>
          <div class="out-knobs">
            <div data-knob="lim_ceiling" data-label="CEILING" data-small="1"></div>
            <div data-knob="lim_release" data-label="REL" data-small="1"></div>
            <div data-knob="master" data-label="OUT" data-small="1"></div>
          </div>
        </div>
      </section>
    </div>

    <!-- Row C: the FX chain in the spec's order -->
    <div class="row row-c">
      <section class="panel">
        <div class="panel-head">
          <span class="panel-title">DRIVE <b>·</b> PHASER</span>
        </div>
        <div class="knob-row">
          <div data-knob="drive" data-label="DRIVE" data-small="1"></div>
          <div data-knob="ph_rate" data-label="RATE" data-small="1"></div>
          <div data-knob="ph_depth" data-label="DEPTH" data-small="1"></div>
          <div data-knob="ph_feedback" data-label="FEED" data-small="1"></div>
          <div data-knob="ph_mix" data-label="MIX" data-small="1"></div>
          <div data-knob="ph_stages" data-label="STAGES" data-small="1"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <span class="panel-title">CHORUS</span>
        </div>
        <div class="knob-row">
          <div data-knob="ch_rate" data-label="RATE" data-small="1"></div>
          <div data-knob="ch_depth" data-label="DEPTH" data-small="1"></div>
          <div data-knob="ch_mix" data-label="MIX" data-small="1"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <span class="panel-title">DELAY</span><span class="spacer"></span>
          <div data-toggle="dly_pingpong" data-label="PING"></div>
        </div>
        <div class="display delay-body"><canvas id="cv-delay"></canvas></div>
        <div class="knob-row">
          <div data-knob="dly_time" data-label="TIME" data-small="1"></div>
          <div data-knob="dly_fb" data-label="FEEDBACK" data-small="1"></div>
          <div data-knob="dly_tone" data-label="TONE" data-small="1"></div>
          <div data-knob="dly_mix" data-label="MIX" data-small="1"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <span class="panel-title">SPACE <b>·</b> SHIMMER</span>
        </div>
        <div class="display space-body"><canvas id="cv-space"></canvas></div>
        <div class="knob-row">
          <div data-knob="rev_size" data-label="SIZE" data-small="1"></div>
          <div data-knob="rev_decay" data-label="DECAY" data-small="1"></div>
          <div data-knob="rev_damp" data-label="DAMP" data-small="1"></div>
          <div data-knob="rev_predelay" data-label="PRE" data-small="1"></div>
        </div>
        <div class="knob-row">
          <div data-knob="rev_shimmer" data-label="SHIMMER" data-small="1"></div>
          <div data-knob="rev_mod" data-label="MOD" data-small="1"></div>
          <div data-knob="rev_mix" data-label="MIX" data-small="1"></div>
        </div>
      </section>
    </div>
  </div>

  <div class="tooltip" id="tooltip"></div>

  <script src="params.js"></script>
  <script src="bridge.js"></script>
  <script src="mock.js"></script>
  <script src="widgets.js"></script>
  <script src="views.js"></script>
  <script src="app.js"></script>
  <script src="ambient.js"></script>
</body>
</html>
