# Single source of truth for all plugin parameters.
# tools/gen_params.py generates C++ (APVTS layout + ID constants) and JS (UI).
# IDs are permanent once released. Rewritten for v1 in T3.6 (spec/tasks/T3.6-instrument.md);
# nothing has been released yet. The defaults are the T3.5b render constants and the T3.1
# sketch's SOUND_DEFAULTS — the owner's ear tunes them from here.
#
# Field reference
#   type:  float | int | choice | bool
#   float: min, max, default, unit, and either `mid` (value shown at the knob's
#          centre → log-like skew) or `skew` (JUCE skew factor). Optional `step`.
#   int:   min, max, default
#   choice: choices, default (must be one of choices)
#   modulatable: may become a mod-matrix target later (informational for now)
#   rebuild: changing it rebuilds a table on a builder thread
#   Template groups (`count` + `template`) expand {n}; a list default gives one value per copy.

version: 2
groups:
  harmony:
    - { id: key,         name: "Key",         type: choice, choices: [C, C#, D, D#, E, F, F#, G, G#, A, A#, B], default: D }
    - { id: mood,        name: "Mood",        type: choice, choices: [Bright, Bittersweet, Nocturnal], default: Bright }
    - { id: scale,       name: "Scale",       type: choice, choices: [Major, Lydian, Penta Major, Minor, Dorian, Penta Minor], default: Major }
    - { id: chord_shape, name: "Chord Shape", type: choice, choices: [Shape 1, Shape 2, Shape 3], default: Shape 1 }
    - { id: progression, name: "Progression", type: float, min: 0, max: 1, default: 1, modulatable: true }
    - { id: transpose,   name: "Transpose",   type: int, min: -24, max: 24, default: 0, unit: st }
    - { id: detune,      name: "Detune",      type: float, min: 0, max: 12, default: 3, unit: ct, modulatable: true }
    - { id: drift,       name: "Drift",       type: float, min: 0, max: 20, default: 4, unit: ct, modulatable: true }

  # Play mode (T3.7, ADR-0008): MIDI notes play the resonators; the drone stays under at play_drone.
  play:
    - { id: play,          name: "Play",          type: bool, default: false }
    - { id: play_attack,   name: "Play Attack",   type: float, min: 0.001, max: 8, default: 0.01, mid: 0.3, unit: s }
    - { id: play_release,  name: "Play Release",  type: float, min: 0.02, max: 20, default: 2.5, mid: 2, unit: s }
    - { id: play_velocity, name: "Play Velocity", type: float, min: 0, max: 1, default: 0.6 }
    - { id: play_drone,    name: "Play Drone",    type: float, min: 0, max: 1, default: 0 }

  layers:
    - { id: red_level,    name: "Red Level",    type: float, min: 0, max: 1, default: 1 }
    - { id: green_level,  name: "Green Level",  type: float, min: 0, max: 1, default: 0.7 }
    - { id: violet_level, name: "Violet Level", type: float, min: 0, max: 1, default: 0.4 }
    - { id: red_decay,    name: "Red Decay",    type: float, min: 5, max: 60, default: 20, mid: 20, unit: s }
    - { id: green_decay,  name: "Green Decay",  type: float, min: 2, max: 30, default: 6, mid: 8, unit: s }
    - { id: violet_decay, name: "Violet Decay", type: float, min: 1, max: 15, default: 2.5, mid: 3, unit: s }
    - { id: width,        name: "Width",        type: float, min: 0, max: 1, default: 0.9 }
    # the low resonator under red (T3.7): the bass note, in the low band (T3.8: from band_floor up)
    - { id: low_level,    name: "Low Level",    type: float, min: 0, max: 1, default: 0.5 }
    - { id: low_decay,    name: "Low Decay",    type: float, min: 1, max: 30, default: 8, mid: 8, unit: s }

  # The resonator bands (T3.8): one pitch axis (MIDI notes) cut by three crossovers between a floor
  # and a ceiling: low [floor, x1), red [x1, x2), green [x2, x3), violet [x3, ceiling). Minimum widths
  # low 12, the others 5; the engine keeps the order and the widths whatever is automated (clamped
  # from the floor upward). These replace register_semis, spread and low_octave. A change re-voices
  # the chord through the double-bank crossfade once it has been still for 300 ms.
  bands:
    - { id: band_floor,   name: "Band Floor",            type: int, min: 21, max: 60,  default: 24 }
    - { id: band_x1,      name: "Crossover Low/Red",     type: int, min: 28, max: 84,  default: 36 }
    - { id: band_x2,      name: "Crossover Red/Green",   type: int, min: 33, max: 96,  default: 50 }
    - { id: band_x3,      name: "Crossover Green/Violet", type: int, min: 38, max: 103, default: 73 }
    - { id: band_ceiling, name: "Band Ceiling",          type: int, min: 43, max: 108, default: 91 }
    - { id: band_blend,   name: "Band Blend",            type: float, min: 0, max: 6, default: 1.5, unit: st }
    - { id: red_tones,    name: "Red Tones",    type: choice, choices: [Root, Root + fifth, Chord, Colours, All], default: Root + fifth }
    - { id: green_tones,  name: "Green Tones",  type: choice, choices: [Root, Root + fifth, Chord, Colours, All], default: Chord }
    - { id: violet_tones, name: "Violet Tones", type: choice, choices: [Root, Root + fifth, Chord, Colours, All], default: Colours }
    - { id: red_shift,    name: "Red Shift",    type: int, min: -12, max: 12, default: 0, unit: st }
    - { id: green_shift,  name: "Green Shift",  type: int, min: -12, max: 12, default: 0, unit: st }
    - { id: violet_shift, name: "Violet Shift", type: int, min: -12, max: 12, default: 0, unit: st }

  macros:
    - { id: macro_storm,  name: "Storm",  type: float, min: 0, max: 1, default: 0.5 }
    - { id: macro_breath, name: "Breath", type: float, min: 0, max: 1, default: 0.35 }
    - { id: macro_glow,   name: "Glow",   type: float, min: 0, max: 1, default: 0.5 }
    - { id: macro_space,  name: "Space",  type: float, min: 0, max: 1, default: 0.5 }
    - { id: macro_drift,  name: "Drift",  type: float, min: 0, max: 1, default: 0.5 }

  # The tone stage (T3.9, dsp/fx/Eq.h): a low shelf, two bells and a 12 dB/oct high cut in series
  # after the sources, each band with its own drive in parallel (only that band saturates). Replaces
  # flt_type, flt_cutoff, flt_reso, flt_sky and drive. eq4_freq at 20000 is "open". eq_sky is a
  # stopgap: T4.2 turns it into the route Activity -> eq4_freq and removes it.
  eq:
    - { id: eq1_freq,  name: "EQ 1 Freq",  type: float, min: 30,  max: 400,   default: 110,   mid: 110,  unit: Hz, modulatable: true }
    - { id: eq1_gain,  name: "EQ 1 Gain",  type: float, min: -12, max: 12,    default: 0,     unit: dB, modulatable: true }
    - { id: eq1_drive, name: "EQ 1 Drive", type: float, min: 0,   max: 1,     default: 0,     modulatable: true }
    - { id: eq2_freq,  name: "EQ 2 Freq",  type: float, min: 80,  max: 3000,  default: 420,   mid: 490,  unit: Hz, modulatable: true }
    - { id: eq2_gain,  name: "EQ 2 Gain",  type: float, min: -12, max: 12,    default: 0,     unit: dB, modulatable: true }
    - { id: eq2_q,     name: "EQ 2 Q",     type: float, min: 0.3, max: 6,     default: 1,     mid: 1.34 }
    - { id: eq2_drive, name: "EQ 2 Drive", type: float, min: 0,   max: 1,     default: 0,     modulatable: true }
    - { id: eq3_freq,  name: "EQ 3 Freq",  type: float, min: 500, max: 12000, default: 2400,  mid: 2450, unit: Hz, modulatable: true }
    - { id: eq3_gain,  name: "EQ 3 Gain",  type: float, min: -12, max: 12,    default: 0,     unit: dB, modulatable: true }
    - { id: eq3_q,     name: "EQ 3 Q",     type: float, min: 0.3, max: 6,     default: 1,     mid: 1.34 }
    - { id: eq3_drive, name: "EQ 3 Drive", type: float, min: 0,   max: 1,     default: 0,     modulatable: true }
    - { id: eq4_freq,  name: "EQ 4 Cut",   type: float, min: 200, max: 20000, default: 20000, mid: 2000, unit: Hz, modulatable: true }
    - { id: eq4_drive, name: "EQ 4 Drive", type: float, min: 0,   max: 1,     default: 0,     modulatable: true }
    - { id: eq_sky,    name: "EQ Sky",     type: float, min: 0,   max: 1,     default: 0.3 }

  phaser:
    - { id: ph_rate,     name: "Phaser Rate",     type: float, min: 0.005, max: 0.5, default: 0.05, mid: 0.05, unit: Hz }
    - { id: ph_depth,    name: "Phaser Depth",    type: float, min: 0, max: 1, default: 0.6 }
    - { id: ph_feedback, name: "Phaser Feedback", type: float, min: 0, max: 0.8, default: 0.3 }
    - { id: ph_mix,      name: "Phaser Mix",      type: float, min: 0, max: 1, default: 0.4, modulatable: true }
    - { id: ph_stages,   name: "Phaser Stages",   type: int, min: 2, max: 8, default: 6 }

  chorus:
    - { id: ch_rate,  name: "Chorus Rate",  type: float, min: 0.01, max: 1, default: 0.1, mid: 0.1, unit: Hz }
    - { id: ch_depth, name: "Chorus Depth", type: float, min: 0, max: 10, default: 3, unit: ms }
    - { id: ch_mix,   name: "Chorus Mix",   type: float, min: 0, max: 1, default: 0.25, modulatable: true }

  delay:
    - { id: dly_time,     name: "Delay Time",     type: float, min: 0.05, max: 4, default: 1.8, mid: 1.0, unit: s }
    - { id: dly_fb,       name: "Delay Feedback", type: float, min: 0, max: 0.95, default: 0.35, modulatable: true }
    - { id: dly_tone,     name: "Delay Tone",     type: float, min: 0, max: 1, default: 0.5 }
    - { id: dly_pingpong, name: "Delay Ping-Pong", type: bool, default: true }
    - { id: dly_mix,      name: "Delay Mix",      type: float, min: 0, max: 1, default: 0.25, modulatable: true }

  reverb:
    - { id: rev_size,     name: "Reverb Size",      type: float, min: 0, max: 1, default: 0.85 }
    - { id: rev_decay,    name: "Reverb Decay",     type: float, min: 0.3, max: 60, default: 9, mid: 8, unit: s, modulatable: true }
    - { id: rev_damp,     name: "Reverb Damping",   type: float, min: 0, max: 1, default: 0.35 }
    - { id: rev_predelay, name: "Reverb Pre-Delay", type: float, min: 0, max: 250, default: 20, unit: ms }
    - { id: rev_shimmer,  name: "Reverb Shimmer",   type: float, min: 0, max: 1, default: 0.2, modulatable: true }
    - { id: rev_mod,      name: "Reverb Modulation", type: float, min: 0, max: 1, default: 0.4 }
    - { id: rev_mix,      name: "Reverb Mix",       type: float, min: 0, max: 1, default: 0.35, modulatable: true }

  output:
    - { id: lim_ceiling, name: "Limiter Ceiling", type: float, min: -12, max: 0, default: -1, unit: dB }
    - { id: lim_release, name: "Limiter Release", type: float, min: 10, max: 1000, default: 200, mid: 150, unit: ms }
    - { id: master,      name: "Output",          type: float, min: -60, max: 0, default: 0, unit: dB }

# Non-automatable state (ValueTree, not APVTS): modulation matrix, focus, frozen snapshot.
state:
  mod_matrix_slots: 16
