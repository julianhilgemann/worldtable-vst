name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60     # a hung build fails within the hour instead of at GitHub's 6 h cap
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS,   os: macos-15 }      # arm64
          - { name: Windows, os: windows-2025 }

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # Keep the job count explicit: a bare --parallel becomes an unlimited `make -j` on
      # macOS, and starting every JUCE unit of every target at once exhausts the 7 GB
      # runner (the TP.1 run hung in this step until the 6 h cap).
      - name: Build
        run: cmake --build build --config Release --parallel 3

      # ctest + pluginval are wired in T0.3.

      - name: Upload plugins
        uses: actions/upload-artifact@v7
        with:
          name: Worldtable-${{ matrix.name }}
          path: |
            build/Worldtable_artefacts/Release/VST3
            build/Worldtable_artefacts/Release/AU
            build/Worldtable_artefacts/Release/Standalone
          if-no-files-found: error
          retention-days: 14
